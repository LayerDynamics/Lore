name: Runtime contracts
on:
  push:
    paths: ['lore/**', 'install.sh', '.github/workflows/runtime-tests.yml']
  pull_request:
    paths: ['lore/**', 'install.sh', '.github/workflows/runtime-tests.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test --prefix lore
      - run: node lore/bin/lore.mjs doctor
